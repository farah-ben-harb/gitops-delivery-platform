apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: devsecops-incident-platform
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/farah-ben-harb/gitops-delivery-platform.git
    targetRevision: main
    path: overlays/local-kind
  destination:
    server: https://kubernetes.default.svc
    namespace: devsecops-platform
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
