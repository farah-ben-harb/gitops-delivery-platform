apiVersion: apps/v1
kind: Deployment
metadata:
  name: devsecops-incident-platform
  namespace: devsecops-platform
  labels:
    app: devsecops-incident-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app: devsecops-incident-platform
  template:
    metadata:
      labels:
        app: devsecops-incident-platform
    spec:
      containers:
        - name: api
          image: ghcr.io/farah-ben-harb/devsecops-incident-platform:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: incident-platform-config
            - secretRef:
                name: incident-platform-secrets
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 5

